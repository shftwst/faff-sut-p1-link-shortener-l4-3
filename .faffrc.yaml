# faff config — SUT P1 (link-shortener). git-only, agile lens, lights-out eligible.
# The two explicit L4 lights-out dials this SUT needs to clear `faff lights-out --check`
# dial-coherence: slots.review (adversarial), slots.spec_review (adversarial). The third leg,
# gates.fallback, is fail-closed BY DEFAULT since FAFF-522 shipped (PR #403) — no explicit line
# needed (FAFF-524 drops the restated-default line FAFF-513 originally planted here).
# git-only pin (FAFF-808): the reserved `none` sentinel asserts this repo has no tracker
# relationship, so every skill resolves git-only BEFORE any MCP discovery and never upgrades to
# tracker-mode even when the Linear MCP is visible in the cage. This is the supported git-only
# lever; it replaces the older `--strict-mcp-config` MCP-disable flag RUN-L4 used to carry.
tracking:
  tracker: none
slots:
  methodology: faffter-dark-methodology-agile-delivery
  spec: faffter-dark-nlspec
  architecture: faffter-noon-architecture
  env: faffter-noon-env-compose
  evaluator: faffter-noon-evaluate
  review: faffter-dark-adversarial-review     # L4 dial: adversarial second-opinion (was faffter-noon-review)
  spec_review: faffter-dark-spec-review       # L4 dial: adversarial spec_review (was unset -> single-pass default)
appetite: high
# git-only autonomous on-switch: default opt-in keeps autonomous OFF; opt-out enables it.
automation_default: opt-out
intake_gate: warn
budget:
  # For L4 lights-out the budget-ceiling gate deliberately EXCLUDES max_attempts (a count is not
  # an L4 governor) — the real spend governors are budget.cost (dollars, priced from the ADR-0048
  # map — FAFF-427, the recommended default), budget.tokens, and budget.until. max_attempts may
  # stay wired as an optional extra backstop only.
  # `faff budget check` sums cache_read, so a small tokens ceiling breaches before a build lands.
  max_attempts: 30
  tokens: 300000000
  # cost: 15   # optional: budget.cost — the recommended L4 governor (FAFF-427)
  at_ceiling: stop
backends:
  gemini-gemma-free:
      provider: gemini
      model: models/gemma-4-31b-it
      host: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GEMINI_API_KEY
      first_byte_timeout: 120
      #timeout: 480
  spark-qwen-3-8:
      provider: openai
      model: unsloth/Qwen3.8-27B-NVFP4
      host: https://spark.longhair-escalator.ts.net/qwen-3-8/v1
      api_key_env: DUMMY_API_KEY
      first_byte_timeout: 180
      reasoning_extra:
          thinking_token_budget: 2000
  openrouter-deepseek-v4-flash:
      provider: openai
      model: deepseek/deepseek-v4-flash-0731
      host: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      first_byte_timeout: 120
      reasoning_off: true
  openrouter-glm-5-2:
      provider: openai
      model: z-ai/glm-5.2:free
      host: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      first_byte_timeout: 180
      reasoning_extra:
          reasoning:
              max_tokens: 2000
  openrouter-glm-5-3-flash:
      provider: openai
      model: z-ai/glm-5.3-flash
      host: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      first_byte_timeout: 180
      reasoning_extra:
          reasoning:
              max_tokens: 2000
  openrouter-gemma:
      provider: openai
      model: google/gemma-4-31b-it
      host: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      first_byte_timeout: 180
      reasoning_extra:
          reasoning:
              max_tokens: 2000
  spark-glimmer:
      provider: openai
      model: glimmer
      host: https://spark.longhair-escalator.ts.net/glimmer/v1
      api_key_env: DUMMY_API_KEY
      first_byte_timeout: 180
      reasoning_extra:
          thinking_token_budget: 2000

adversarial:
  timeout: 900     # per-attempt stream deadline (s); default 120. spec_review's only clock. Sized for a max_tokens:12000 review (~9min at ~22 tok/s) plus large-payload prompt-eval headroom. Was 1500 when max_tokens was 32000 (the empty-out workaround); FAFF-918's thinking_token_budget caps reasoning directly, so reviews finish far sooner.
  deadline: 3600   # code_review + judge total wall-clock (s), sliced per backend; default 480. 3 refuter backends x 900s timeout = each gets one full attempt (2700 is exactly 3x900, no slack). A fast-failing backend hands its unspent slice back to the survivors (the per-backend slice is work-conserving), which is what leaves room for the fallbacks; the judge is dispatched separately and carries its own --deadline. IGNORED by spec_review (which sends no --deadline).
  refs:
    - spark-qwen-3-8
    - openrouter-deepseek-v4-flash
    - spark-glimmer
  code_review:
    max_tokens: 12000
  spec_review:
    max_tokens: 12000
  spec_judge:
    keepgoing_bound: 2
    refs:
      - openrouter-gemma
      - openrouter-glm-5-3-flash
      - openrouter-glm-5-2

sentry:
  stall_window_secs: 7200
  run_elapsed_ceiling_skip_when_live: true

capture:
  decision_kernel: "on"
